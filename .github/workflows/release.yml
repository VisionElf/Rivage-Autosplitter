name: Release autosplitter

on:
  push:
    branches: [main]
    paths:
      - Rivage.asl
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish the ASL script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s Rivage.asl
          export RELEASE_TAG="main-${GITHUB_SHA}"
          sha256sum Rivage.asl > Rivage.asl.sha256
          cat > release-notes.md <<EOF
          ASL autosplitter for the supported Windows Steam build of Rivage.

          ## Changes

          This automated release packages the script from commit ${GITHUB_SHA}.
          [View the source changes](https://github.com/${GH_REPO}/commit/${GITHUB_SHA}).

          ## Installation and start setting

          Download Rivage.asl and load it in LiveSplit.
          The following is a reminder of existing behavior, not a change in this release:
          - Start: After Cutscene unchecked (default): start after the first New Game loading screen closes.
          - Start: After Cutscene checked: start after the second loading screen closes, following the introduction or its skip.

          See the repository README for installation, supported builds and validation status.

          Developed by Codex, under the supervision of VisionElf.
          EOF

          existing_tag=$(gh api --paginate "repos/${GH_REPO}/releases" \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .tag_name")
          if [[ "$existing_tag" == "$RELEASE_TAG" ]]; then
            gh release upload "$RELEASE_TAG" Rivage.asl Rivage.asl.sha256 --clobber
            gh release edit "$RELEASE_TAG" --draft=false --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" Rivage.asl Rivage.asl.sha256 \
              --target "$GITHUB_SHA" --title "Rivage Autosplitter (${GITHUB_SHA:0:7})" \
              --notes-file release-notes.md --latest=false
          fi

          main_script_sha=$(gh api "repos/${GH_REPO}/contents/Rivage.asl?ref=main" --jq '.sha')
          release_script_sha=$(git hash-object Rivage.asl)
          if [[ "$main_script_sha" == "$release_script_sha" ]]; then
            gh release edit "$RELEASE_TAG" --latest
          fi
